version: "3.9"

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  db-data:
  mm-data:
  mm-config:
  mm-logs:
  mm-plugins:

services:
  db:
    <<: *common
    build:
      context: ./mattermost/db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mattermost:
    <<: *common
    build:
      context: ./mattermost/mattermost
    environment:
      - MM_SQLSETTINGS_DRIVERNAME=${MM_SQLSETTINGS_DRIVERNAME}
      - MM_SQLSETTINGS_DATASOURCE=${MM_SQLSETTINGS_DATASOURCE}
      - MM_SERVICESETTINGS_SITEURL=${MM_SERVICESETTINGS_SITEURL}
    volumes:
      - mm-data:/mattermost/data
      - mm-config:/mattermost/config
      - mm-logs:/mattermost/logs
      - mm-plugins:/mattermost/plugins
    networks:
      - frontend
      - backend
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8065/api/v4/system/ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  nginx:
    <<: *common
    build:
      context: ./mattermost/nginx
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./mattermost/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend
    depends_on:
      mattermost:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3

  bridge:
    <<: *common
    build:
      context: ./mattermost/bridge
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN:-}
      - DISCORD_SERVER=${DISCORD_SERVER:-}
      - DISCORD_CHANNEL=${DISCORD_CHANNEL:-}
      - MATTERMOST_BOT_TOKEN=${MATTERMOST_BOT_TOKEN:-}
      - MATTERMOST_TEAM=${MATTERMOST_TEAM:-}
      - MATTERMOST_CHANNEL=${MATTERMOST_CHANNEL:-}
    networks:
      - frontend
    depends_on:
      mattermost:
        condition: service_healthy
