worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Pas de numéro de version dans les en-têtes et les pages d'erreur
    server_tokens off;

    # Pièces jointes Mattermost (1 Mo par défaut dans Nginx, 50 Mo côté Mattermost)
    client_max_body_size 50m;

    # DNS interne de Docker : l'adresse de Mattermost est re-résolue à chaque
    # requête (via la variable), sinon Nginx garde l'IP vue au démarrage et
    # renvoie 502 dès que le conteneur mattermost est recréé.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80 default_server;
        server_name _;

        set $mattermost_upstream mattermost:8065;

        location / {
            proxy_pass http://$mattermost_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v4/websocket {
            proxy_pass http://$mattermost_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }

    # Page de statut : même port 80, sélectionnée par le nom d'hôte
    # (*.localhost pointe vers 127.0.0.1 dans les navigateurs)
    server {
        listen 80;
        server_name status.localhost;

        set $status_upstream status:8080;

        location / {
            proxy_pass http://$status_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
